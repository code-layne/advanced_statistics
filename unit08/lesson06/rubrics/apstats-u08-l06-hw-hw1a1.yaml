# Homework item 1a, test type (Unit 8, Lesson 8.6). Relative to the lesson directory.
id: hw1a1
points: 1
task: >-
  A counselor randomly selects 180 teenagers and classifies them by grade
  (9th/10th/11th, 60 each) and sleep amount (<7 hours / 7+ hours). Identify the test
  type.
criteria:
  - id: type
    points: 1
    full: >-
      Names a chi-square test for independence (one random sample of 180 classified by
      grade and sleep). The stem describes ONE random sample classified on two variables
      (independence); the answer key says homogeneity (treating the 60-per-grade totals as
      separate samples). Accept either when it is consistent with the reasoning given.
