# Homework item 2c (Unit 8, Lesson 8.6). Relative to the lesson directory.
id: hw2c
points: 2
task: >-
  A student computes chi-square = 9.21 for a 2 x 4 table (df = 3; critical value 7.815
  at alpha = 0.05). Can the student reject H0? Explain.
criteria:
  - id: answer
    points: 1
    full: >-
      Says yes, reject H0.
  - id: reason
    points: 1
    full: >-
      Because 9.21 > 7.815 (the critical value for df = 3), equivalently the p-value is
      below 0.05 (between 0.025 and 0.05).
