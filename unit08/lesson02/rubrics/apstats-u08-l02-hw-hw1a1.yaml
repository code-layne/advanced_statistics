# Homework item 1a, H0 (Unit 8, Lesson 8.2). Relative to the lesson directory.
id: hw1a1
points: 1
task: >-
  Offspring are expected in a 9:3:3:1 phenotype ratio (phenotypes A, B, C, D). State
  the null hypothesis for a chi-square goodness-of-fit test.
criteria:
  - id: null
    points: 1
    full: >-
      States H0 as the claimed distribution: p_A = 9/16, p_B = 3/16, p_C = 3/16, p_D =
      1/16 (or in words: the phenotypes follow the 9:3:3:1 ratio). Must be about
      population proportions, not sample counts.
