# Homework item 1a (Unit 7, Lesson 7.7). Relative to the lesson directory.
id: hw1a
points: 2
task: >-
  A 95% CI for mu_northern - mu_southern (mean emergency response time, minutes) is
  (-2.37, 0.37). Interpret the interval in context.
criteria:
  - id: confidence
    points: 1
    full: >-
      States 95% confidence that the interval captures the true difference (not a
      probability statement about the parameter).
  - id: context
    points: 1
    full: >-
      Names the parameter: the difference in MEAN response time, northern minus southern,
      between -2.37 and 0.37 minutes.
examples:
  - response: "There is a 95% chance the true difference is in the interval."
    scores: {confidence: 0, context: 1}
