# Homework item 3a mu_d (Unit 7, Lesson 7.4). Relative to the lesson directory.
id: hw3a3
points: 1
task: >-
  Ten participants do a reaction-time task before and after two weeks with an app; the
  differences (before - after) are roughly symmetric with no outliers. Define the
  parameter mu_d.
criteria:
  - id: parameter
    points: 1
    full: >-
      mu_d = the true mean difference in reaction time (before - after) for all people
      using the app (a population mean of the differences, in context).
