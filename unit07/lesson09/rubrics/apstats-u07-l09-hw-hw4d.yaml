# Homework item 4d (Unit 7, Lesson 7.9). Relative to the lesson directory.
id: hw4d
points: 2
task: >-
  Random samples of 25 current-design engines (mean 31.4 mpg, s = 2.8) and 25
  new-design (mean 33.1 mpg, s = 3.2); dotplots roughly symmetric. Do the mean fuel
  efficiencies differ? t about -2.00, df about 47, two-sided p about 0.051. Conclude
  (alpha = 0.05).
criteria:
  - id: decision
    points: 1
    full: >-
      Compares p (about 0.051) to alpha = 0.05 and fails to reject H0.
  - id: context
    points: 1
    full: >-
      Concludes there is not convincing evidence (at the 5% level) that the two engine
      designs have different mean fuel efficiencies.
