# Homework item 3d (Unit 7, Lesson 7.5). Relative to the lesson directory.
id: hw3d
points: 2
task: >-
  Ten students' quiz-score differences (flashcards - no flashcards): d-bar = 4.8, s_d
  = 2.97; boxplot roughly symmetric, no outliers. t about 5.11, df = 9, p about
  0.0003. State the conclusion (alpha = 0.05).
criteria:
  - id: decision
    points: 1
    full: >-
      Compares p (about 0.0003) to alpha = 0.05 and rejects H0.
  - id: context
    points: 1
    full: >-
      Concludes there is convincing evidence that using flashcards increases the true mean
      quiz score (mean difference greater than 0).
