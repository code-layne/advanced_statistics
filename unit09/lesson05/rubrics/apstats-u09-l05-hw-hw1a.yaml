# Homework item 1a (Unit 9, Lesson 9.5). Relative to the lesson directory.
id: hw1a
points: 3
task: >-
  Age (x, years) vs maximum running speed (y, mph), random sample of 28 adult
  recreational runners: b = -0.12, SE_b = 0.037, t = -3.24, p = 0.003. State H0 and Ha
  in terms of beta. Define beta in context.
criteria:
  - id: beta
    points: 1
    full: >-
      Defines beta as the true (population) slope of the regression line relating maximum
      running speed to age for adult recreational runners.
  - id: null
    points: 1
    full: >-
      H0: beta = 0.
  - id: alt
    points: 1
    full: >-
      Ha: beta != 0 (a one-sided beta < 0 with a stated reason is acceptable).
