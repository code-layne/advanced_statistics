# Homework item 1d (Unit 9, Lesson 9.3). Relative to the lesson directory.
id: hw1d
points: 2
task: >-
  A random sample of 50 college students: hours of sleep (x) vs GPA (y); 95% CI for
  the slope is (0.08, 0.44). A colleague claims beta = 0.2. Is this consistent with
  the interval? Explain.
criteria:
  - id: answer
    points: 1
    full: >-
      Says yes, consistent (plausible).
  - id: reason
    points: 1
    full: >-
      Because 0.2 is inside (0.08, 0.44); does not claim the CI proves beta = 0.2.
