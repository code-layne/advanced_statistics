# Homework item 1e (Unit 9, Lesson 9.2). Relative to the lesson directory.
id: hw1e
points: 2
task: >-
  Sleep (x, hours) vs reaction time (y, ms) for a random sample of 22 college
  students: b = -18.6, SE_b = 5.3, 95% CI (-29.7, -7.5). Does the CI provide evidence
  of a negative linear relationship? Explain.
criteria:
  - id: answer
    points: 1
    full: >-
      Says yes.
  - id: reason
    points: 1
    full: >-
      Because the entire interval is below 0 (0 is not in the interval), so beta < 0 is
      supported: more sleep is associated with lower (faster) reaction times.
