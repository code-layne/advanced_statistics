# AP Practice item 3, part (b) (Unit 2, Lesson 2.1). Relative to the lesson directory.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: ap3b
points: 2
task: >-
  A grocery chain surveyed 400 households (Urban: 150 in store, 60 delivery, 40
  curbside pickup, total 250; Rural: 105 in store, 15 delivery, 30 pickup, total 150).
  Is there an association between location and grocery method? Justify.
criteria:
  - id: association
    points: 2
    full: >-
      E: Says yes, there is an association, AND justifies by comparing conditional
      percents for the two locations (e.g. 24% of urban vs. 10% of rural households use
      delivery, or 60% vs. 70% shop in store), in context.
    partial: >-
      P (1 of 2): Says yes with a comparison of raw counts instead of percents, OR
      compares correct percents without a clear conclusion about association.
