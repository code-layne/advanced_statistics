# Homework item 1b, statistic (Unit 5, Lesson 5.1). Relative to the lesson directory.
id: hw1b1
points: 1
task: >-
  In a survey of 200 randomly selected college students, 64 said they exercise at
  least 3 times per week; the survey estimates the proportion of all college students
  who do so. Identify the statistic.
criteria:
  - id: statistic
    points: 1
    full: >-
      Identifies the sample proportion of the 200 students who exercise at least 3 times
      per week (64/200 = 0.32).
