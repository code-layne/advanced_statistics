# Homework item 1a, statistic (Unit 5, Lesson 5.1). Relative to the lesson directory.
id: hw1a1
points: 1
task: >-
  A researcher records the resting heart rate of a random sample of 80 adults; the
  sample mean is 72 bpm. The researcher wants to estimate the mean heart rate of all
  adults. Identify the statistic.
criteria:
  - id: statistic
    points: 1
    full: >-
      Identifies the sample mean resting heart rate of the 80 adults (72 bpm).
examples:
  - response: "the mean heart rate of all adults"
    scores: {statistic: 0}
