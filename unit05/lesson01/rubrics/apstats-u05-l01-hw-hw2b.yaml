# Homework item 2b (Unit 5, Lesson 5.1). Relative to the lesson directory.
id: hw2b
points: 2
task: >-
  Two researchers each measure 15 different randomly selected seedlings from the same
  greenhouse and get mean heights of 4.3 cm and 4.7 cm. Is either measurement
  necessarily wrong? Why or why not?
criteria:
  - id: answer
    points: 1
    full: >-
      Says no, neither measurement is wrong.
  - id: reason
    points: 1
    full: >-
      Explains that different random samples from the same population naturally give
      different sample means by chance (sampling variability).
