# Homework item 1a (Unit 5, Lesson 5.6). Relative to the lesson directory.
id: hw1a
points: 3
task: >-
  48% of men and 61% of women read for pleasure at least once a week (p1 = 0.48, p2 =
  0.61); independent random samples of 200 men and 220 women are selected. Check all
  conditions for using the normal model for the difference in sample proportions.
criteria:
  - id: random_10
    points: 1
    full: >-
      Random: both samples are random (stated); 10%: 200 men and 220 women are each at
      most 10% of their national populations.
  - id: independent
    points: 1
    full: >-
      Says the two samples (groups) are independent of each other.
  - id: large_counts
    points: 1
    full: >-
      Large Counts: 200(0.48) = 96, 200(0.52) = 104, 220(0.61) = 134.2, 220(0.39) = 85.8,
      all at least 10.
examples:
  - response: "Both samples are random and large (n > 30)."
    scores: {random_10: 0, independent: 0, large_counts: 0}
