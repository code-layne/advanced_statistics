# AP Practice item 5, part (c) (Unit 1, Lesson 1.6). Relative to the lesson directory.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: ap5c
points: 2
task: >-
  One server's shift tip totals over three months, shown as side-by-side boxplots.
  Weekday: min $42, Q1 $55, median $62, Q3 $70, max $84. Weekend: min $60, Q1 $78,
  median $88, Q3 $106, max $158 (plotted as a separate point; the weekend whisker ends
  near $130). Compare the weekday and weekend tip totals. Address center, variability,
  and unusual features, in context.
criteria:
  - id: compare
    points: 2
    full: >-
      E: Using comparative language and in context, says ALL of: weekend tips are
      typically higher (median $88 vs $62); weekend tips are more variable (IQR $28 vs
      $15, or a wider range); and names an unusual feature (the $158 weekend outlier, or
      weekend right skew; no weekday outliers).
    partial: >-
      P (1 of 2): Correctly compares two of the three (center, variability, unusual
      features), or all three but without comparative language or context.
