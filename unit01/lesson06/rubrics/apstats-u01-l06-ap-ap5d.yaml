# AP Practice item 5, part (d) (Unit 1, Lesson 1.6). Relative to the lesson directory.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: ap5d
points: 2
task: >-
  One server's shift tip totals over three months, shown as side-by-side boxplots.
  Weekday: min $42, Q1 $55, median $62, Q3 $70, max $84. Weekend: min $60, Q1 $78,
  median $88, Q3 $106, max $158 (plotted as a separate point; the weekend whisker ends
  near $130). The manager wants to know whether there are two distinct kinds of
  weekend night. Name a display to ask for instead, and say what it could show that
  this one cannot.
criteria:
  - id: display
    points: 2
    full: >-
      E: Names a display that shows the shape in detail (dotplot, histogram, or stemplot
      of the weekend totals) AND says it could show two clusters, a gap, or a second peak,
      which a boxplot hides because it reports only five summary numbers.
    partial: >-
      P (1 of 2): Names an appropriate display without saying what it would reveal, OR
      explains what the boxplot hides but names an unsuitable display (or none).
