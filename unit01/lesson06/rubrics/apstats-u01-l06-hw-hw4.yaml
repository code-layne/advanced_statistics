# Homework item 4 (Unit 1, Lesson 1.6). Relative to the lesson directory.
id: hw4
points: 4
task: >-
  Boxplots of two pizza shops' delivery times: Shop A min 14, Q1 19, median 22, Q3 25,
  max 31; Shop B min 12, Q1 17, median 26, Q3 34, max 44 (minutes). Compare center,
  variability, and unusual features in context with comparative language, then say
  which shop to order from in a hurry.
criteria:
  - id: center
    points: 1
    full: >-
      Compares centers with comparative language: Shop A's median (about 22 minutes) is
      lower than Shop B's (about 26 minutes).
  - id: variability
    points: 1
    full: >-
      Compares variability: Shop A's delivery times are less variable (IQR about 6 vs 17
      minutes, or range about 17 vs 32).
  - id: unusual
    points: 1
    full: >-
      Addresses unusual features or shape: no outliers shown in either shop, Shop B's
      times trail (skew) to the right.
  - id: decision
    points: 1
    full: >-
      Chooses Shop A when in a hurry, consistent with the comparison and in context.
