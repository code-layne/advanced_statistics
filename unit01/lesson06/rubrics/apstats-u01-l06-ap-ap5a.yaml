# AP Practice item 5, part (a) (Unit 1, Lesson 1.6). Relative to the lesson directory.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: ap5a
points: 2
task: >-
  One server's shift tip totals over three months, shown as side-by-side boxplots.
  Weekday: min $42, Q1 $55, median $62, Q3 $70, max $84. Weekend: min $60, Q1 $78,
  median $88, Q3 $106, max $158 (plotted as a separate point; the weekend whisker ends
  near $130). Report the five-number summary for the weekday shifts, and say what each
  of the five numbers marks on the weekday display.
criteria:
  - id: summary
    points: 2
    full: >-
      E: Reports min $42, Q1 $55, median $62, Q3 $70, max $84 AND says what each marks:
      the whisker ends are the min and max, the box edges are Q1 and Q3, the line inside
      the box is the median.
    partial: >-
      P (1 of 2): Reports all five numbers correctly without saying what they mark on the
      display, OR describes the display parts correctly with one or two values wrong.
