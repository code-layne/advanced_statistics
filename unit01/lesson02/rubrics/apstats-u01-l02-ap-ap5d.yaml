# AP Practice item 5, part (d) (Unit 1, Lesson 1.2). Relative to the lesson directory.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: ap5d
points: 2
task: >-
  A school surveyed its 9th and 12th graders about how they would prefer to spend an
  activity period. 300 ninth graders: Sports 150, Clubs 90, Study hall 60. 120 twelfth
  graders: Sports 42, Clubs 30, Study hall 48. Identify one preference where the two
  grades differ most, and describe that difference in context using relative
  frequencies.
criteria:
  - id: differ
    points: 2
    full: >-
      E: Identifies study hall AND describes the difference with relative frequencies in
      context: 20% of ninth graders vs 40% of seniors (seniors chose it at twice the
      rate).
    partial: >-
      P (1 of 2): Identifies study hall without correct relative frequencies, OR compares
      correct relative frequencies for a preference that does not differ most, OR omits
      the context.
