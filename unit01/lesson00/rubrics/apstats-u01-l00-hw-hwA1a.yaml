# Homework Part A, item 1, individuals (Unit 1, Lesson 1.0). Relative to the lesson directory.
id: hwA1a
points: 1
task: >-
  A city record lists six food trucks licensed for one downtown lot, with Cuisine,
  Menu items, Avg. wait (min), and Cash only? for each truck (waits range from 4 to 19
  minutes). Name the individuals in this record.
criteria:
  - id: individuals
    points: 1
    full: >-
      Names the food trucks (the six trucks licensed for the lot) as the individuals, not
      the customers, the cuisines, or the variables.
examples:
  - response: "the customers"
    scores: {individuals: 0}
