# Homework item 3 (Unit 1, Lesson 1.3). Relative to the lesson directory.
id: hw3
points: 2
task: >-
  In a histogram the bars touch; in a bar graph they do not. Explain what that
  difference is telling you about the horizontal axis.
criteria:
  - id: histogram
    points: 1
    full: >-
      Says a histogram's horizontal axis is a number line (quantitative scale), so
      adjacent intervals meet and the bars touch.
  - id: bargraph
    points: 1
    full: >-
      Says a bar graph's axis holds separate categories with no numerical distance between
      them, so the gaps show they are not a continuum.
