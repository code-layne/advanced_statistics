# Unit 1 practice (sample) test, item 18b. Path relative to unit01/tests/.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: t18b
points: 3
task: >-
  Can the exact median be found from the histogram of 50 trout lengths? If not, which
  interval holds it? Explain.
criteria:
  - id: exact
    points: 1
    full: >-
      E: Says no, because the values are grouped into intervals.
  - id: interval
    points: 2
    full: >-
      E: Names 32-36 cm, explained by counting: 19 trout are under 32 cm and 34 under 36,
      so the 25th and 26th values lie in 32-36 cm.
    partial: >-
      P (1 of 2): Names 32-36 cm without the counting explanation, or explains with a
      counting slip.
