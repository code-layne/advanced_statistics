# Unit 1 actual test, item 20b. Path relative to unit01/tests/.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: t20b
points: 2
task: >-
  Cup amounts are approximately normal with mean 12 oz and SD 0.4 oz. About what
  percent get less than 11.2 ounces?
criteria:
  - id: part
    points: 2
    full: >-
      E: About 2.5%: 11.2 is 2 SDs below the mean, and half of the 5% outside 2 SDs lies
      below.
    partial: >-
      P (1 of 2): Identifies 2 SDs below the mean but gives a wrong percent (e.g. 5% or
      47.5%).
