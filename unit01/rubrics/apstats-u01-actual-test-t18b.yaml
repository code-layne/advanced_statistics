# Unit 1 actual test, item 18b. Path relative to unit01/tests/.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: t18b
points: 3
task: >-
  Can the exact median be found from the histogram of 50 pumpkin weights? If not,
  which interval holds it? Explain.
criteria:
  - id: exact
    points: 1
    full: >-
      E: Says no, because the values are grouped into intervals.
  - id: interval
    points: 2
    full: >-
      E: Names 12-16 lb, explained by counting: 20 pumpkins are under 12 lb and 32 under
      16, so the 25th and 26th values lie in 12-16 lb.
    partial: >-
      P (1 of 2): Names 12-16 lb without the counting explanation, or explains with a
      counting slip.
