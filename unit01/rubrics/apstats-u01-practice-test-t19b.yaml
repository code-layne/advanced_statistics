# Unit 1 practice (sample) test, item 19b. Path relative to unit01/tests/.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: t19b
points: 3
task: >-
  Use the 1.5 x IQR rule to decide whether $58 is an outlier. If it is, where does the
  upper whisker of a modified boxplot end?
criteria:
  - id: rule
    points: 2
    full: >-
      E: IQR = 22 - 12 = 10, fence Q3 + 1.5(IQR) = 37, and $58 > $37 so $58 is an outlier.
    partial: >-
      P (1 of 2): Computes the fence with one error but draws the matching conclusion, or
      concludes correctly without showing the fence.
  - id: whisker
    points: 1
    full: >-
      E: The upper whisker ends at $25, the largest price that is not an outlier.
