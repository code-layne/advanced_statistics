# Unit 1 practice (sample) test, item 20c. Path relative to unit01/tests/.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: t20c
points: 2
task: >-
  One egg weighs 51 grams (mean 58 g, SD 4 g). Find its z-score and interpret it in
  context.
criteria:
  - id: part
    points: 2
    full: >-
      E: z = (51 - 58)/4 = -1.75 AND interprets: this egg weighs 1.75 SDs below the mean
      egg weight of 58 grams.
    partial: >-
      P (1 of 2): Correct z with no or an incorrect interpretation, or a correct
      interpretation of a z with an arithmetic slip.
