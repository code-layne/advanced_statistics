# Semester 1 actual final, item 27e. Path relative to semester1/tests/.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: t27e
points: 4
task: >-
  Residual plot for iced coffees sold vs temperature (random scatter); temperatures in
  the data run from 62 to 95 degrees F. Decide whether a linear model is appropriate.
  Then explain why the owner should not use the line to predict sales on a 20-degree
  winter day.
criteria:
  - id: pattern
    points: 1
    full: >-
      E: The residuals are scattered randomly above and below 0, with no curved pattern.
  - id: decision
    points: 1
    full: >-
      E: So a linear model is appropriate for these data.
  - id: extrapolation
    points: 1
    full: >-
      E: 20 degrees F is far outside the 62 to 95 degrees in the data: this is
      extrapolation.
  - id: consequence
    points: 1
    full: >-
      E: The linear pattern may not continue there, so the prediction is unreliable (the
      line gives about -16.5 coffees, which is impossible).
