# Semester 1 actual final, item 27c. Path relative to semester1/tests/.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: t27c
points: 3
task: >-
  yhat = -51.98 + 1.774(temperature). One day had a high of 78 degrees F and 80 iced
  coffees sold. Find the residual for this day and interpret it in context.
criteria:
  - id: prediction
    points: 1
    full: >-
      E: Predicted coffees = -51.98 + 1.774(78) = 86.39 (86.4 accepted).
  - id: residual
    points: 1
    full: >-
      E: Residual = actual - predicted = 80 - 86.39 = -6.39 coffees (about -6.4), with
      the correct sign.
  - id: interpretation
    points: 1
    full: >-
      E: The bakery sold about 6.4 fewer iced coffees than the line predicted for a
      78-degree day.
