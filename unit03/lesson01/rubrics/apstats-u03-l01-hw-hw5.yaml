# Homework item B2 (Unit 3, Lesson 3.1) — the crux restated. Relative to the lesson directory.
id: hw5
points: 2
task: >-
  Researchers gave 600 Riverside adults step counters and recorded every step they took
  for a month. Dog owners walked more minutes a day than non-owners. The local paper
  wrote, "Because every step was measured so carefully, this was an experiment ---
  getting a dog will make you walk more." Is the paper right? Explain in context.
criteria:
  - id: study_type
    points: 1
    full: >-
      Says the paper is wrong about the design: no one was assigned to own a dog, so it
      is an observational study no matter how carefully the steps were measured.
  - id: cause
    points: 1
    full: >-
      Says the study shows only an association, so it cannot show that getting a dog
      causes more walking; may name an alternative (people who already like to walk are
      the ones who get dogs).
examples:
  - response: "Yes, they measured every step, so the results are accurate and dogs make you walk."
    scores: {study_type: 0, cause: 0}
