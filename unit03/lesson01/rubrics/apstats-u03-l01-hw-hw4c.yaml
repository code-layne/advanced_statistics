# Homework item 4c (Unit 3, Lesson 3.1). Relative to the lesson directory.
id: hw4c
points: 2
task: >-
  Is a bigger (non-random) sample better than the random sample of registered voters?
  Explain.
criteria:
  - id: answer
    points: 1
    full: >-
      Says no.
  - id: explain
    points: 1
    full: >-
      Explains that a larger non-random sample does not reduce bias (it just gives more
      biased data), so a smaller random sample is more trustworthy.
examples:
  - response: "Yes, more data is always better."
    scores: {answer: 0, explain: 0}
