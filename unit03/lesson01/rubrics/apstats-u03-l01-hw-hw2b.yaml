# Homework item 2b (Unit 3, Lesson 3.1). Relative to the lesson directory.
id: hw2b
points: 2
task: >-
  A health researcher randomly selects 150 adults from a hospital's patient database
  and asks about their exercise habits. Who is included, and is there any concern?
criteria:
  - id: included
    points: 1
    full: >-
      Says only the hospital's patients are included (the random sample represents that
      patient population).
  - id: concern
    points: 1
    full: >-
      Raises the concern that hospital patients may not represent all adults (for example,
      they may be less healthy or exercise less), so generalizing beyond the patient
      population needs caution.
