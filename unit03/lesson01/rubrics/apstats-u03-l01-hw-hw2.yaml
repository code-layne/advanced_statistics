# Homework item A2 (Unit 3, Lesson 3.1). Relative to the lesson directory.
id: hw2
points: 2
task: >-
  Plan 2: a computer picks 400 households at random from Riverside's list of all 40,000
  addresses, and each one is asked whether it supports a dog park. Name the population
  and the sample.
criteria:
  - id: population
    points: 1
    full: >-
      Population: all 40,000 Riverside households (the whole group the city wants to know
      about).
  - id: sample
    points: 1
    full: >-
      Sample: the 400 households the computer picked (the households actually asked).
examples:
  - response: "Population: dog owners. Sample: 400."
    scores: {population: 0, sample: 0}
