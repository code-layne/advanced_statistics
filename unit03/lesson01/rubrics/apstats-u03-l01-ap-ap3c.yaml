# AP Practice item 3, part (c) (Unit 3, Lesson 3.1) — the spiral to Unit 2. Relative to the lesson directory.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: ap3c
points: 2
task: >-
  Name a graph that displays the relationship between energy drinks per day and hours
  of sleep for the 1,500 adults, and describe the pattern you would expect.
criteria:
  - id: display
    points: 2
    full: >-
      E: Names a scatterplot (either variable on either axis, ideally drinks on x and
      sleep on y) AND describes a negative association in context: adults who drink more
      energy drinks tend to sleep fewer hours.
    partial: >-
      P (1 of 2): Names a scatterplot but gives no pattern or the wrong direction, or
      describes the negative pattern correctly but names an inappropriate graph.
