# AP Practice item 3, part (b) (Unit 3, Lesson 3.1). Relative to the lesson directory.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: ap3b
points: 2
task: >-
  For the energy-drink records study (an observational study of 1,500 adults), a
  headline reads, "Energy drinks cause sleepless nights." Does this study support the
  headline? Explain in context.
criteria:
  - id: cause
    points: 2
    full: >-
      E: Says no AND explains that because no treatment was imposed (observational
      study), the study shows only an association between energy drinks and sleep, not
      cause; ideally names a plausible other variable (night-shift work, stress, long
      work hours) that could lead to both more energy drinks and less sleep.
    partial: >-
      P (1 of 2): Says no with only a slogan ("correlation is not causation") and no
      reference to the study's design or the context.
examples:
  - response: "Yes, the people who drank more slept less, so the drinks caused it."
    scores: {cause: 0}
