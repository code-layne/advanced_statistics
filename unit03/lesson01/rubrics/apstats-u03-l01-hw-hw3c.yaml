# Homework item 3c (Unit 3, Lesson 3.1). Relative to the lesson directory.
id: hw3c
points: 2
task: >-
  A company surveys its own employees to determine what the average worker in the city
  earns. How might the result be distorted?
criteria:
  - id: direction
    points: 1
    full: >-
      Says the estimate will be too high or too low if this company pays above or below
      the city average.
  - id: reason
    points: 1
    full: >-
      Explains that one company's wage structure need not reflect the whole city's
      workforce.
