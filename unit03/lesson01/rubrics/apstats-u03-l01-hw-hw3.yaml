# Homework item A3 (Unit 3, Lesson 3.1). Relative to the lesson directory.
id: hw3
points: 2
task: >-
  A council member asks, "Why not just ask every one of the 40,000 households?" What is
  that plan called, and give one reason the city might not use it.
criteria:
  - id: census
    points: 1
    full: Names the plan a census.
  - id: reason
    points: 1
    full: >-
      Gives a reasonable cost of a census in context: reaching all 40,000 households
      takes too much time or money, many would not respond, or a random sample of 400
      can estimate the percent well enough.
