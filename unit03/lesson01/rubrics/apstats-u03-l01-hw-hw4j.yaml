# Homework item B1, justification of the multiple-choice answer (Unit 3, Lesson 3.1). Relative to the lesson directory.
id: hw4j
points: 1
task: >-
  The parks department wants to know whether adding lights to a park reduces evening
  vandalism. Which plan is an experiment? (A) compare parks that already have lights
  with parks that do not (B) survey residents (C) rangers keep a careful daily log of
  vandalism for a year (D) randomly choose 10 of the city's 20 parks to get new lights,
  then compare vandalism (E) review police reports from cities that chose to light their
  parks. Justify the choice.
criteria:
  - id: justify
    points: 1
    full: >-
      Justifies (D): the department imposes the treatment (new lights) on parks it
      chooses at random; every other plan only observes what already happens, however
      carefully it records it.
