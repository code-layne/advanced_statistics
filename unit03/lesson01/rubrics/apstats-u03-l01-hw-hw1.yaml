# Homework item A1 (Unit 3, Lesson 3.1). Relative to the lesson directory.
id: hw1
points: 2
task: >-
  Riverside (40,000 households) wants to know what percent support a dog park. Plan 1:
  post a poll on the city's social media page and count the votes. Plan 2: a computer
  picks 400 households at random from the city's list of all addresses, and each one is
  asked. Which plan uses chance to decide who answers? In the other plan, who decides?
criteria:
  - id: chance_plan
    points: 1
    full: >-
      Identifies Plan 2 as the chance-based plan (the 400 households are picked at
      random).
  - id: who_decided
    points: 1
    full: >-
      Says that in Plan 1 the residents themselves decide, by choosing to see the post
      and vote (voluntary response).
