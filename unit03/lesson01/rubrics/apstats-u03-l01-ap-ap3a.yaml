# AP Practice item 3, part (a) (Unit 3, Lesson 3.1). Relative to the lesson directory.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: ap3a
points: 2
task: >-
  A health researcher reviews survey records for 1,500 adults in one county. Adults who
  drink two or more energy drinks a day report sleeping fewer hours per night, on
  average, than adults who drink none. Is this an observational study or an experiment?
  Explain.
criteria:
  - id: type
    points: 2
    full: >-
      E: Says observational study AND explains that no treatment was imposed: the
      researcher only examined records of what the adults already did, and no one was
      assigned to drink or not drink energy drinks.
    partial: >-
      P (1 of 2): Says observational study with a vague or generic reason (for example,
      "they just collected data") that does not say no treatment was assigned.
