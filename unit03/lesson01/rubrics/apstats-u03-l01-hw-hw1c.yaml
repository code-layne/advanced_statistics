# Homework item 1c (Unit 3, Lesson 3.1). Relative to the lesson directory.
id: hw1c
points: 2
task: >-
  A magazine publishes an online poll asking readers whether they support a new
  environmental regulation; over 10,000 people vote. Explain how the results might be
  distorted.
criteria:
  - id: direction
    points: 1
    full: >-
      Says the results will over-represent strongly held opinions about the regulation
      (voluntary response bias).
  - id: size
    points: 1
    full: >-
      Says the large number of votes (10,000) does not fix the bias: a large biased sample
      is still biased.
examples:
  - response: "The sample is big so it is accurate."
    scores: {direction: 0, size: 0}
