# Homework item A3 (Unit 3, Lesson 3.3). Relative to the lesson directory.
id: hw3
points: 2
task: >-
  Only 610 of the 1,000 teens selected in Plan 2 pick up the call. Name this bias, and
  explain how the 390 who did not answer might differ from the 610 who did.
criteria:
  - id: name
    points: 1
    full: >-
      Names nonresponse bias (selected teens could not be reached or did not answer).
  - id: differ
    points: 1
    full: >-
      Gives a plausible, context-based way the 390 differ in phone use while driving (for
      example, busy teens or teens driving when called are more likely to use a phone at the
      wheel, so the estimate is too low). A difference unrelated to phone use while driving
      does not earn the point.
