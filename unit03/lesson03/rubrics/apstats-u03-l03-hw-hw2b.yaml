# Homework item 2b (Unit 3, Lesson 3.3). Relative to the lesson directory.
id: hw2b
points: 2
task: >-
  A school district has 5 elementary schools (each with about 400 students); a
  researcher wants to sample 100 students about their reading habits. Describe how to
  use a cluster sample (clusters = schools).
criteria:
  - id: random
    points: 1
    full: >-
      Randomly selects one school (or as many schools as needed for about 100 students) as
      the cluster(s).
  - id: all
    points: 1
    full: >-
      Surveys every student in the selected school(s).
examples:
  - response: "Randomly select 20 students from each school."
    scores: {random: 0, all: 0}
