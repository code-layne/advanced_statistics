# Homework item 2a (Unit 3, Lesson 3.3). Relative to the lesson directory.
id: hw2a
points: 2
task: >-
  A school district has 5 elementary schools (each with about 400 students); a
  researcher wants to sample 100 students about their reading habits. Describe how to
  use a stratified sample (strata = schools).
criteria:
  - id: strata
    points: 1
    full: >-
      Treats each of the 5 schools as a stratum (divides the students by school).
  - id: select
    points: 1
    full: >-
      Takes a separate simple random sample from every school, e.g. 20 students from each,
      for 100 in all.
examples:
  - response: "Randomly pick one school and survey everyone in it."
    scores: {strata: 0, select: 0}
