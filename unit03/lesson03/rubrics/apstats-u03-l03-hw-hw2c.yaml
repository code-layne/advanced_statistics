# Homework item 2c (Unit 3, Lesson 3.3). Relative to the lesson directory.
id: hw2c
points: 2
task: >-
  A school district has 5 elementary schools (each with about 400 students); a
  researcher wants to sample 100 students about their reading habits. Are the schools
  better described as strata or clusters? Explain.
criteria:
  - id: answer
    points: 1
    full: >-
      Says clusters.
  - id: reason
    points: 1
    full: >-
      Explains that each school contains a mix of all kinds of students (heterogeneous
      within, like a mini-population), while strata should be groups of similar
      (homogeneous) individuals.
