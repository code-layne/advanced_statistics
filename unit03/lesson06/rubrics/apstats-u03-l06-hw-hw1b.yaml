# Homework item 1b (Unit 3, Lesson 3.6). Relative to the lesson directory.
id: hw1b
points: 2
task: >-
  A psychologist tests whether mindfulness training reduces anxiety in 40 college
  students; men and women may respond differently. Justify the recommended design (a
  block design, blocking by gender).
criteria:
  - id: variable
    points: 1
    full: >-
      Says gender is a known variable that may affect how anxiety responds to mindfulness
      training.
  - id: precision
    points: 1
    full: >-
      Says blocking by gender removes that variability from the comparison, giving a more
      precise estimate of the treatment effect.
