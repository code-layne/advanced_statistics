# Homework item 1c, diagram (Unit 3, Lesson 3.6). Relative to the lesson directory.
id: hw1c
points: 3
task: >-
  A psychologist tests whether mindfulness training reduces anxiety in 40 college
  students; men and women may respond differently. Draw a diagram of the block design.
criteria:
  - id: blocks
    points: 1
    full: >-
      Splits the 40 students into blocks by gender (men, women).
  - id: assign
    points: 1
    full: >-
      Within each block, randomly assigns students to the mindfulness training and to a
      control group (e.g., 10 and 10).
  - id: compare
    points: 1
    full: >-
      Shows the response (anxiety) being measured and compared between treatments within
      each block.
examples:
  - response: "40 students randomly split into mindfulness (20) and control (20); compare anxiety."
    scores: {blocks: 0, assign: 1, compare: 1}
