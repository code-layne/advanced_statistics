# Homework item 2, generalize to (Unit 3, Lesson 3.7). Relative to the lesson directory.
id: hw2d
points: 1
task: >-
  60 student volunteers are randomly assigned to an active-learning classroom or a
  traditional lecture; the active-learning group scores significantly higher on the
  final exam. To what population can the results be generalized?
criteria:
