# Homework item 3, conclusion (Unit 3, Lesson 3.7). Relative to the lesson directory.
id: hw3e
points: 2
task: >-
  A drug company randomly selects 500 patients from all patients at 10 major hospitals
  and randomly assigns them to a new drug or a placebo; the drug group shows a
  statistically significant improvement. Write a proper scope-of-inference conclusion.
criteria:
  - id: causation
    points: 1
    full: >-
      States that the new drug caused the improvement, because the patients were randomly
      assigned to drug or placebo.
  - id: generalization
    points: 1
    full: >-
      States that the finding can be generalized to the patients at these hospitals,
      because the patients were randomly selected from them.
