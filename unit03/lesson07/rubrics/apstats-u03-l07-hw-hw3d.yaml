# Homework item 3, generalize to (Unit 3, Lesson 3.7). Relative to the lesson directory.
id: hw3d
points: 1
task: >-
  A drug company randomly selects 500 patients from all patients at 10 major hospitals
  and randomly assigns them to a new drug or a placebo; the drug group shows a
  statistically significant improvement. To what population can the results be
  generalized?
criteria:
  - id: population
    points: 1
    full: >-
      Names the patients at these 10 hospitals (or similar hospital patients).
