# Homework item 2, explanation (Unit 3, Lesson 3.2). Relative to the lesson directory.
id: hw2f
points: 2
task: >-
  A tech company recruits 80 employees and randomly assigns 40 to a standing-desk
  program and 40 to regular desks; the standing-desk group reports significantly less
  back pain. Explain what conclusions are valid.
criteria:
  - id: causation
    points: 1
    full: >-
      Says the standing desks caused the reduction in back pain because the employees were
      randomly assigned to the groups.
  - id: generalize
    points: 1
    full: >-
      Says the results cannot be generalized to all office workers because the employees
      were recruited volunteers, not randomly selected; they apply only to employees like
      these.
