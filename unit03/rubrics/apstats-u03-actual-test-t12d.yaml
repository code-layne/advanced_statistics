# Unit 3 actual test, item 12d. Path relative to unit03/tests/.
# College Board style: each component is scored E (essentially correct, full
# points), P (partially correct, the partial points given) or I (incorrect, 0).
id: t12d
points: 2
task: >-
  The new-fertilizer plants averaged 0.5 kg more. A dotplot of 100 random reshuffles is
  given. How many reshuffles gave a difference of 0.5 kg or more? Is the observed
  difference statistically significant? Explain.
criteria:
  - id: count
    points: 1
    full: >-
      E: 18 of the 100 reshuffles gave a difference of 0.5 kg or more.
  - id: conclusion
    points: 1
    full: >-
      E: No, not statistically significant, because a difference that large happens
      about 18% of the time from the random assignment alone, as if the fertilizer did
      nothing, in context. A conclusion with no link to the simulation is I.
