# Homework item 4 (Unit 3, Lesson 3.5). Relative to the lesson directory.
id: hw4
points: 2
task: >-
  Why does random assignment (not just random selection) allow us to conclude
  causation from an experiment?
criteria:
  - id: balance
    points: 1
    full: >-
      Says random assignment spreads potential confounding variables (motivation, health,
      habits, genetics) roughly evenly across the treatment groups.
  - id: attribute
    points: 1
    full: >-
      Concludes that a difference in the response can then be attributed to the treatment
      rather than to a pre-existing difference between groups (random selection alone
      allows generalizing, not cause and effect).
