# Homework item 2c (Unit 3, Lesson 3.4). Relative to the lesson directory.
id: hw2c
points: 2
task: >-
  A phone survey randomly selects households from a list of landline numbers to ask
  about online shopping habits. How does this distort the estimate of online shopping
  frequency?
criteria:
  - id: direction
    points: 1
    full: >-
      Says the estimate of online shopping frequency will be too low.
  - id: reason
    points: 1
    full: >-
      Explains that the excluded (cell-phone-only, younger) adults tend to shop online
      more often than those with landlines.
