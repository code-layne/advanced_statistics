# Homework item 1c (Unit 3, Lesson 3.4). Relative to the lesson directory.
id: hw1c
points: 1
task: >-
  A radio station asks listeners to call in and answer: "Do you think schools should
  start later?" 78% of 2,400 callers say yes. Suggest an improvement.
criteria:
  - id: improve
    points: 1
    full: >-
      Replaces the call-in poll with random selection, e.g. a random sample of parents and
      students from school records.
examples:
  - response: "Get more callers."
    scores: {improve: 0}
