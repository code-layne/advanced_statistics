# Homework item 2b (Unit 6, Lesson 6.4). Relative to the lesson directory.
id: hw2b
points: 3
task: >-
  A seed company claims 85% germinate; a researcher believes the rate is lower. 162 of
  200 randomly selected seeds germinate. Verify conditions.
criteria:
  - id: random
    points: 1
    full: >-
      Random: the sample is random (stated / assumed), so the condition is met.
  - id: largecounts
    points: 1
    full: >-
      Large Counts using p0: shows n p0 = 200(0.85) = 170 and n(1 - p0) = 200(0.15) = 30
      are both at least 10.
  - id: tenpct
    points: 1
    full: >-
      10%: 200 is at most 10% of all the company's seeds.
examples:
  - response: "Large counts: n is bigger than 30."
    scores: {random: 0, largecounts: 0, tenpct: 0}
