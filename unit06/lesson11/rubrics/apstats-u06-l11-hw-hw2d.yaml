# Homework item 2d (Unit 6, Lesson 6.11). Relative to the lesson directory.
id: hw2d
points: 2
task: >-
  Employee turnover: new onboarding program, 18 of 240 left within the first year; old
  program, 30 of 240. Test whether the new program reduced turnover (one-sided, alpha
  = 0.05). Conclude in context.
criteria:
  - id: decision
    points: 1
    full: >-
      Compares the p-value to alpha: p-value about 0.034 <= 0.05, so reject H0.
  - id: context
    points: 1
    full: >-
      Concludes in context: there is convincing evidence that the true first-year turnover
      proportion is lower for the new onboarding program.
