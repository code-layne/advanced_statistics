# Homework item 2, Conclude (Unit 6, Lesson 6.6). Relative to the lesson directory.
id: hw2d
points: 2
task: >-
  A national study: 72% of high school students do at least one extracurricular; an
  administrator believes her district's rate has changed. 193 of 250 randomly selected
  students participate. alpha = 0.05. Conclude.
criteria:
  - id: decision
    points: 1
    full: >-
      Compares the p-value to alpha: p-value about 0.067 > 0.05, so fail to reject H0.
  - id: context
    points: 1
    full: >-
      Concludes in context: there is not convincing evidence that the true participation
      rate in the district differs from 72% (does not claim H0 is proven).
